name: BCV Realtime Monitor & Push Notifications

on:
  schedule:
    # Lunes a Viernes: vigilancia activa continua durante la ventana crítica del BCV (hora Venezuela / UTC-4)
    # Usamos minutos no estándar (23, 38, 53) para reducir retrasos de cola en runners gratuitos de GitHub
    # 20:23 UTC = 4:23 PM VET (vigilancia activa en tiempo real de 35 min cada 25s)
    # 20:38 UTC = 4:38 PM VET
    # 20:53 UTC = 4:53 PM VET
    # 21:08 UTC = 5:08 PM VET
    # 21:23 UTC = 5:23 PM VET
    - cron: '23 20 * * 1-5'
    - cron: '38 20 * * 1-5'
    - cron: '53 20 * * 1-5'
    - cron: '08 21 * * 1-5'
    - cron: '23 21 * * 1-5'
  workflow_dispatch:
    inputs:
      test:
        description: 'Enviar notificación push de prueba aunque ya exista'
        required: false
        default: false
        type: boolean

jobs:
  check-and-notify:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install firebase-admin

      - name: Check BCV and Push Notification
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          IS_TEST: ${{ github.event.inputs.test }}
        run: |
          if [ "$IS_TEST" = "true" ]; then
            node scripts/bcv-cloud-monitor.js --test
          else
            node scripts/bcv-cloud-monitor.js --watch
          fi

      - name: Commit updated state if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [[ -n $(git status -s state/last_bcv.json) ]]; then
            git add state/last_bcv.json
            git commit -m "chore(sync): actualizar estado de tasa BCV notificada [skip ci]"
            git push origin main
          fi
