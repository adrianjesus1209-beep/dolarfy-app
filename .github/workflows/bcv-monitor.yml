name: BCV Realtime Monitor & Push Notifications

on:
  schedule:
    # Lunes a Viernes: Pre-calentamiento escalonado para absorber cualquier retraso de cola de GitHub Actions
    # y mantener un runner activo en Modo Turbo (cada 5s) durante toda la ventana de 4:05 PM a 5:55 PM VET (UTC-4).
    - cron: '15 15 * * 1-5' # 11:15 AM VET (absorbe retrasos de hasta 5 horas)
    - cron: '15 16 * * 1-5' # 12:15 PM VET (absorbe retrasos de hasta 4 horas)
    - cron: '15 17 * * 1-5' # 1:15 PM VET  (absorbe retrasos de hasta 3 horas)
    - cron: '15 18 * * 1-5' # 2:15 PM VET  (absorbe retrasos de hasta 2 horas)
    - cron: '15 19 * * 1-5' # 3:15 PM VET  (absorbe retrasos de hasta 1 hora)
    - cron: '05 20 * * 1-5' # 4:05 PM VET  (inicio directo de ventana Turbo)
    - cron: '23 20 * * 1-5' # 4:23 PM VET
    - cron: '38 20 * * 1-5' # 4:38 PM VET
    - cron: '53 20 * * 1-5' # 4:53 PM VET
  workflow_dispatch:
    inputs:
      test:
        description: 'Enviar notificación push de prueba aunque ya exista'
        required: false
        default: false
        type: boolean

concurrency:
  group: bcv-realtime-monitor
  cancel-in-progress: false

jobs:
  check-and-notify:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install firebase-admin

      - name: Check BCV and Push Notification
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          IS_TEST: ${{ github.event.inputs.test }}
        run: |
          if [ "$IS_TEST" = "true" ]; then
            node scripts/bcv-cloud-monitor.js --test
          else
            node scripts/bcv-cloud-monitor.js --watch
          fi

      - name: Commit updated state if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [[ -n $(git status -s state/last_bcv.json) ]]; then
            git add state/last_bcv.json
            git commit -m "chore(sync): actualizar estado de tasa BCV notificada [skip ci]"
            git pull --rebase origin main || true
            git push origin main
          fi
