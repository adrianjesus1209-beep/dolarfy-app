name: BCV Realtime Monitor & Push Notifications

on:
  schedule:
    # Lunes a Viernes: vigilancia activa continua durante la ventana crítica del BCV (hora Venezuela / UTC-4)
    # 20:20 UTC = 4:20 PM VET (vigilancia activa en tiempo real de 35 min cada 25s)
    # 20:30 UTC = 4:30 PM VET
    # 20:45 UTC = 4:45 PM VET
    # 21:00 UTC = 5:00 PM VET
    # 21:20 UTC = 5:20 PM VET
    - cron: '20 20 * * 1-5'
    - cron: '30 20 * * 1-5'
    - cron: '45 20 * * 1-5'
    - cron: '0 21 * * 1-5'
    - cron: '20 21 * * 1-5'
  workflow_dispatch: # Permite probarlo manualmente desde GitHub o dispararlo vía webhook API

jobs:
  check-and-notify:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install firebase-admin

      - name: Check BCV and Push Notification
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/bcv-cloud-monitor.js --watch

      - name: Commit updated state if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [[ -n $(git status -s state/last_bcv.json) ]]; then
            git add state/last_bcv.json
            git commit -m "chore(sync): actualizar estado de tasa BCV notificada [skip ci]"
            git push origin main
          fi
