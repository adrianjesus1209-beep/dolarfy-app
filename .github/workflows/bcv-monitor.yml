name: BCV Realtime Monitor & Push Notifications

on:
  schedule:
    # Red de seguridad 24/7 cada 30 minutos por si GitHub reinicia máquinas físicas
    - cron: '12,42 * * * *'
  workflow_dispatch:
    inputs:
      test:
        description: 'Enviar notificación push de prueba aunque ya exista'
        required: false
        default: false
        type: boolean
      max_minutes:
        description: 'Duración del turno en minutos (por defecto 310 = 5h 10m)'
        required: false
        default: '310'
        type: string

concurrency:
  group: bcv-realtime-monitor
  cancel-in-progress: false

jobs:
  check-and-notify:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-save firebase-admin

      - name: Check BCV and Push Notification
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          IS_TEST: ${{ github.event.inputs.test }}
          MAX_WATCH_MINUTES: ${{ github.event.inputs.max_minutes }}
        run: |
          if [ "$IS_TEST" = "true" ]; then
            node scripts/bcv-cloud-monitor.js --test
          else
            node scripts/bcv-cloud-monitor.js --watch
          fi

      - name: Commit updated state if changed
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [[ -n $(git status -s state/last_bcv.json) ]]; then
            git checkout -- package.json package-lock.json 2>/dev/null || true
            git add state/last_bcv.json
            git commit -m "chore(sync): actualizar estado de tasa BCV notificada"
            git pull --rebase origin main || true
            git push origin main
          fi

      - name: Relay next monitor shift (Auto-Chain via workflow_dispatch)
        if: always() && github.event.inputs.test != 'true'
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_RELAY_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          echo "🚀 Disparando siguiente turno continuo por vía rápida (workflow_dispatch)..."
          gh workflow run bcv-monitor.yml --ref main || true
