name: BCV Realtime Monitor & Push Notifications

on:
  schedule:
    # Lunes a Viernes: Ejecución cada 10 minutos entre 4:00 PM y 5:50 PM VET (20:00 a 21:50 UTC)
    - cron: '*/10 20-21 * * 1-5'
  workflow_dispatch:
    inputs:
      test:
        description: 'Enviar notificación push de prueba aunque ya exista'
        required: false
        default: false
        type: boolean

concurrency:
  group: bcv-realtime-monitor
  cancel-in-progress: true

jobs:
  check-and-notify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install firebase-admin

      - name: Check BCV and Push Notification
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          IS_TEST: ${{ github.event.inputs.test }}
        run: |
          if [ "$IS_TEST" = "true" ]; then
            node scripts/bcv-cloud-monitor.js --test
          else
            node scripts/bcv-cloud-monitor.js --watch
          fi

      - name: Commit updated state if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [[ -n $(git status -s state/last_bcv.json) ]]; then
            git add state/last_bcv.json
            git commit -m "chore(sync): actualizar estado de tasa BCV notificada [skip ci]"
            git pull --rebase origin main || true
            git push origin main
          fi
