name: BCV Realtime Monitor & Push Notifications

on:
  schedule:
    # Lunes a Viernes: Pre-calentamiento desde 12:05 PM VET (16:05 UTC) hasta 5:35 PM VET (21:35 UTC)
    # para absorber hasta 3 horas de cola en GitHub Actions y llegar a las 4:00 PM VET con el servidor ya encendido.
    - cron: '5,35 16-21 * * 1-5'
  workflow_dispatch:
    inputs:
      test:
        description: 'Enviar notificación push de prueba aunque ya exista'
        required: false
        default: false
        type: boolean

concurrency:
  group: bcv-realtime-monitor
  cancel-in-progress: false

jobs:
  check-and-notify:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-save firebase-admin

      - name: Check BCV and Push Notification
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          IS_TEST: ${{ github.event.inputs.test }}
        run: |
          if [ "$IS_TEST" = "true" ]; then
            node scripts/bcv-cloud-monitor.js --test
          else
            node scripts/bcv-cloud-monitor.js --watch
          fi

      - name: Commit updated state if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [[ -n $(git status -s state/last_bcv.json) ]]; then
            git checkout -- package.json package-lock.json 2>/dev/null || true
            git add state/last_bcv.json
            git commit -m "chore(sync): actualizar estado de tasa BCV notificada [skip ci]"
            git pull --rebase origin main || true
            git push origin main
          fi
