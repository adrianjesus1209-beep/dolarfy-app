<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0B0E14" />
  <title>Dolarfy - Tasas Financieras en Tiempo Real</title>
  
  <link rel="manifest" href="manifest.json" />
  
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brandDark: '#0B0E14',
            cardDark: 'rgba(22, 27, 34, 0.75)',
            neonGreen: '#10B981',
            neonRed: '#EF4444',
            neonCyan: '#06B6D4'
          }
        }
      }
    }
  </script>

  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- ApexCharts CDN -->
  <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>

  <!-- Custom CSS -->
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body class="bg-[#0B0E14] text-gray-100 min-h-screen flex flex-col justify-between overflow-x-hidden antialiased selection:bg-cyan-500 selection:text-black">

  <!-- Application Header (Mobile Top Bar) -->
  <header class="safe-top sticky top-0 z-40 bg-[#0B0E14]/80 backdrop-blur-xl border-b border-white/10 px-5 py-3.5 flex items-center justify-between">
    <div class="flex items-center space-x-2.5">
      <img src="assets/img/logo.webp" alt="Dolarfy Logo" class="w-9 h-9 rounded-xl object-contain shadow-lg shadow-cyan-500/20" />
      <div>
        <h1 class="text-lg font-black tracking-tight text-white leading-none">Dolarfy</h1>
        <span class="text-[10px] text-gray-400 font-semibold tracking-wider uppercase">Finance Mobile</span>
      </div>
    </div>

    <div class="flex items-center space-x-2">
      <button aria-label="Notificaciones" class="p-2 rounded-xl bg-white/5 border border-white/10 text-gray-300 hover:text-white transition-all active:scale-95">
        <i data-lucide="bell" class="w-4 h-4"></i>
      </button>
      <button aria-label="Ajustes" class="p-2 rounded-xl bg-white/5 border border-white/10 text-gray-300 hover:text-white transition-all active:scale-95">
        <i data-lucide="sliders-horizontal" class="w-4 h-4"></i>
      </button>
    </div>
  </header>

  <!-- Main Content SPA Mount Container -->
  <main id="app-view-container" class="flex-1 px-4 pt-5 max-w-md mx-auto w-full">
    <!-- Renderizado dinámico de Dashboard, Calculadora y Analytics -->
  </main>

  <!-- Bottom Navigation Bar Mobile (Fixed Floating) -->
  <nav class="fixed bottom-0 left-0 right-0 z-50 glass-nav safe-bottom max-w-md mx-auto px-6 py-2">
    <div class="flex justify-around items-center h-12">
      <button data-tab="dashboard" class="nav-item flex flex-col items-center justify-center text-cyan-400 font-bold transition-all">
        <i data-lucide="layout-dashboard" class="w-5 h-5"></i>
        <span class="text-[11px] font-bold mt-1">Inicio</span>
      </button>

      <button data-tab="calculator" class="nav-item flex flex-col items-center justify-center text-gray-500 hover:text-gray-300 font-medium transition-all">
        <i data-lucide="calculator" class="w-5 h-5"></i>
        <span class="text-[11px] font-medium mt-1">Calculadora</span>
      </button>

      <button data-tab="analytics" class="nav-item flex flex-col items-center justify-center text-gray-500 hover:text-gray-300 font-medium transition-all">
        <i data-lucide="line-chart" class="w-5 h-5"></i>
        <span class="text-[11px] font-medium mt-1">Tendencias</span>
      </button>
    </div>
  </nav>

  <!-- Main JavaScript App Entrypoint (ES6 Module) -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
