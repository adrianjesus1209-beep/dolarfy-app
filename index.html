<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0B0E14">
  <title>Dolarfy - Tasas Financieras en Tiempo Real</title>

  <link rel="manifest" href="manifest.json">

  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brandDark: '#0B0E14',
            cardDark: 'rgba(22, 27, 34, 0.75)',
            neonGreen: '#10B981',
            neonRed: '#EF4444',
            neonCyan: '#06B6D4'
          }
        }
      }
    }
  </script>

  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- ApexCharts CDN -->
  <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>

  <!-- Custom CSS -->
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body class="bg-[#0B0E14] text-gray-100 min-h-screen flex flex-col justify-between overflow-x-hidden antialiased selection:bg-cyan-500 selection:text-black">

  <!-- Application Header (Mobile Top Bar) -->
  <header class="safe-top sticky top-0 z-40 bg-[#0B0E14]/80 backdrop-blur-xl border-b border-white/10 px-4 py-3 flex items-center justify-between">
    <div class="flex items-center space-x-2">
      <img src="assets/img/logo.webp" alt="Dolarfy Logo" class="w-8 h-8 rounded-xl object-contain shadow-lg shadow-cyan-500/20">
      <div>
        <h1 class="text-base font-black tracking-tight text-white leading-none">Dolarfy</h1>
        <span class="text-[9px] text-gray-400 font-semibold tracking-wider uppercase">Finance Mobile</span>
      </div>
    </div>

    <div class="flex items-center space-x-2">
      <!-- Selector de País Principal -->
      <button id="header-country-btn" type="button" aria-label="Seleccionar País" class="country-selector-trigger flex items-center space-x-1.5 px-2.5 py-1.5 rounded-xl bg-cyan-500/10 border border-cyan-500/30 text-cyan-300 hover:bg-cyan-500/20 transition-all active:scale-95 text-xs font-bold cursor-pointer">
        <img id="header-country-flag-img" src="https://flagcdn.com/w40/ve.png" alt="Bandera" class="w-4 h-4 rounded-full object-cover border border-cyan-500/30">
        <span id="header-country-code" class="text-xs font-extrabold text-cyan-300 uppercase">VE</span>
        <i data-lucide="chevron-down" class="w-3.5 h-3.5 text-cyan-400"></i>
      </button>

      <button id="header-bell-btn" type="button" aria-label="Notificaciones" class="relative p-2 rounded-xl bg-white/5 border border-white/10 text-gray-300 hover:text-white transition-all active:scale-95 cursor-pointer">
        <i data-lucide="bell" class="w-4 h-4 text-cyan-400"></i>
        <span id="header-bell-dot" class="absolute top-1.5 right-1.5 w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
      </button>
    </div>
  </header>

  <!-- Main Content SPA Mount Container -->
  <main id="app-view-container" class="flex-1 px-4 pt-5 max-w-md mx-auto w-full">
    <!-- Renderizado dinámico de Dashboard, Calculadora y Analytics -->
  </main>

  <!-- Bottom Navigation Bar Mobile (Fixed Floating) -->
  <nav class="fixed bottom-0 left-0 right-0 z-50 glass-nav safe-bottom max-w-md mx-auto px-6 py-2">
    <div class="flex justify-around items-center h-12">
      <button type="button" data-tab="dashboard" class="nav-item flex flex-col items-center justify-center text-cyan-400 font-bold transition-all">
        <i data-lucide="layout-dashboard" class="w-5 h-5"></i>
        <span class="text-[11px] font-bold mt-1">Inicio</span>
      </button>

      <button type="button" data-tab="calculator" class="nav-item flex flex-col items-center justify-center text-gray-500 hover:text-gray-300 font-medium transition-all">
        <i data-lucide="calculator" class="w-5 h-5"></i>
        <span class="text-[11px] font-medium mt-1">Calculadora</span>
      </button>

      <button type="button" data-tab="analytics" class="nav-item flex flex-col items-center justify-center text-gray-500 hover:text-gray-300 font-medium transition-all">
        <i data-lucide="line-chart" class="w-5 h-5"></i>
        <span class="text-[11px] font-medium mt-1">Tendencias</span>
      </button>
    </div>
  </nav>

  <!-- Main JavaScript App Entrypoint (ES6 Module) -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
